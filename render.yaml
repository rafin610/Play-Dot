# Render Blueprint for the Play-Dot FastAPI backend.
# Secrets use sync:false and must be entered in Render's Environment UI.
services:
  - type: web
    name: play-dot-api
    runtime: docker
    plan: starter
    branch: main
    repo: https://github.com/rafin610/Play-Dot
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: "off"
    numInstances: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: MOVIEBOX_GUEST_TOKEN
        sync: false
      - key: MOVIEBOX_USER_ID
        sync: false
      - key: MOVIEBOX_GATEWAY_SECRET
        sync: false
      - key: MOVIEBOX_APPID
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: ENABLE_EXTERNAL_PLAYER
        value: "false"
      - key: SESSION_TTL_SECONDS
        value: "1800"
      - key: MAX_SESSIONS
        value: "500"
      # Set this to the exact HTTPS dashboard origin when the dashboard is deployed.
      - key: CORS_ORIGINS
        sync: false
      # In-app update settings are optional. Configure APP_UPDATE_APK_URL (public
      # HTTPS), APP_UPDATE_LATEST_VERSION_CODE, APP_UPDATE_LATEST_VERSION_NAME,
      # APP_UPDATE_MINIMUM_VERSION_CODE, APP_UPDATE_APK_SHA256, and
      # APP_UPDATE_APK_SIZE_BYTES in the Render dashboard only after a signed
      # APK is hosted. See docs/UPDATE_SYSTEM.md. Leave unset to keep
      # /app-update returning 503.
