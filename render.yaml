# Render Blueprint for the MovieBox internal API.
#
# This file prepares the service but does not deploy it. Importing a Blueprint
# is a separate, explicit action performed by the repository owner.
#
# Secrets are marked `sync: false`: Render prompts for them and stores them
# outside Git. Never replace these with literal values in this file.
services:
  - type: web
    name: moviebox-internal-api
    runtime: python
    plan: free
    # Sessions live in process memory; keep exactly one instance.
    numInstances: 1
    branch: main
    repo: https://github.com/rafin610/Play-Dot
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn moviebox_api_server:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    # Do not redeploy automatically until the owner explicitly approves a release.
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: MOVIEBOX_GUEST_TOKEN
        sync: false
      - key: MOVIEBOX_USER_ID
        sync: false
      - key: MOVIEBOX_GATEWAY_SECRET
        sync: false
      - key: MOVIEBOX_APPID
        sync: false
      # A Render web service has no desktop player binary. Disable the local-only
      # launch endpoint so it returns a clear 501 instead of failing unpredictably.
      - key: ENABLE_EXTERNAL_PLAYER
        value: "false"
      # Sessions are in-process memory; keep one worker and bounded idle sessions.
      - key: SESSION_TTL_SECONDS
        value: "1800"
      - key: MAX_SESSIONS
        value: "500"
